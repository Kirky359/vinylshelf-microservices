global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files: [/etc/prometheus/alert.rules.yml]

alerting:
  alertmanagers:
    - static_configs: [{targets: ["alertmanager:9093"]}]

scrape_configs:
  # targets come from Consul
  - job_name: vinylshelf-services
    consul_sd_configs:
      - server: consul:8500
    relabel_configs:
      - source_labels: [__meta_consul_service]
        regex: (api-gateway|.*-service)
        action: keep
      - source_labels: [__meta_consul_health]
        regex: passing
        action: keep
      - source_labels: [__meta_consul_service]
        target_label: service
      - source_labels: [__meta_consul_service_id]
        target_label: instance

  # queue depth of RabbitMQ
  - job_name: rabbitmq
    metrics_path: /metrics/detailed
    params:
      family: [queue_coarse_metrics]
    static_configs: [{targets: ["rabbitmq:15692"]}]
