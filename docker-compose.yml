name: vinylshelf

services:
  consul:
    image: hashicorp/consul:1.20
    command: agent -dev -client=0.0.0.0 -ui
    ports: ["8500:8500"]
    networks: [appnet]
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    ports: ["5672:5672", "15672:15672"]
    networks: [appnet]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  auth-service:
    build: ./auth-service
    networks: [appnet]
    depends_on: &infra
      consul: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}

  catalog-service:          # stateless -> safe to scale: docker compose up -d --scale catalog-service=3
    build: ./catalog-service
    networks: [appnet]
    environment:
      CHAOS_DELAY_MS: ${CATALOG_DELAY_MS:-0} 
    depends_on:
      consul: {condition: service_healthy}

  collection-service:       # own SQLite DB (outbox + saga_log) on a volume
    build: ./collection-service
    networks: [appnet]
    volumes: [collection-data:/data]
    environment:
      SAGA_TIMEOUT_SECONDS: "20"
    depends_on: *infra

  rating-service:
    build: ./rating-service
    networks: [appnet]
    depends_on: *infra

  analytics-consumer:       # own SQLite DB (inbox); every 3rd album_completed fails on purpose
    build: ./analytics-consumer
    networks: [appnet]
    volumes: [analytics-data:/data]
    environment:
      FAIL_EVERY_N: "3"
    depends_on: *infra

  keycloak:                 # OAuth 2.0 / OpenID Connect authorization server (realm is imported on start)
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8081          # public issuer URL (browser, "iss" claim)
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"     # the gateway reaches it as http://keycloak:8080
      KC_HTTP_ENABLED: "true"
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-github-client-id}          # third-party IdP (GitHub OAuth App), see README
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-github-client-secret}
    volumes: ["./keycloak:/opt/keycloak/data/import:ro"]
    ports: ["8081:8080"]
    networks: [appnet]

  api-gateway:              # validates JWT access tokens + scopes, answers CORS
    build: ./api-gateway
    ports: ["8080:8080"]
    networks: [appnet]
    environment:
      CORS_ORIGINS: "https://cad.kpi.ua"
      CHAOS_DELAY_MS: ${GATEWAY_DELAY_MS:-0}
    depends_on:
      consul: {condition: service_healthy}
      keycloak: {condition: service_started}

  # lab 6: observability
  prometheus:
    image: prom/prometheus:v2.55.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--web.enable-lifecycle"]
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
    ports: ["9090:9090"]
    networks: [appnet]
    depends_on: [consul, alertmanager]

  alertmanager:
    image: prom/alertmanager:v0.27.0
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes: ["./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro"]
    ports: ["9093:9093"]
    networks: [appnet]

  loki:
    image: grafana/loki:3.2.1
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes: ["./observability/loki/loki.yml:/etc/loki/loki.yml:ro"]
    ports: ["3100:3100"]
    networks: [appnet]

  promtail:
    image: grafana/promtail:3.2.1
    command: ["-config.file=/etc/promtail/promtail.yml"]
    volumes:
      - ./observability/promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [appnet]
    depends_on: [loki]

  grafana:
    image: grafana/grafana:11.3.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    networks: [appnet]
    depends_on: [prometheus, loki]

  n8n:
    image: docker.n8n.io/n8nio/n8n:1.70.3
    entrypoint: ["/bin/sh", "-c"]
    command:
      - n8n import:workflow --separate --input=/workflows; n8n update:workflow --all --active=true; exec n8n start
    environment:
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_SECURE_COOKIE: "false"
      NODE_FUNCTION_ALLOW_BUILTIN: fs
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
    volumes: ["./observability/n8n:/workflows:ro", "n8n-data:/home/node/.n8n"]
    ports: ["5678:5678"]
    networks: [appnet]
    depends_on: [alertmanager]

volumes:
  n8n-data:
  collection-data:
  analytics-data:

networks:
  appnet:
    driver: bridge
