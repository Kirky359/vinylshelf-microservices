name: vinylshelf

services:
  consul:
    image: hashicorp/consul:1.20
    command: agent -dev -client=0.0.0.0 -ui
    ports: ["8500:8500"]
    networks: [appnet]
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    ports: ["5672:5672", "15672:15672"]
    networks: [appnet]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  auth-service:
    build: ./auth-service
    networks: [appnet]
    depends_on: &infra
      consul: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}

  catalog-service:          # stateless -> safe to scale: docker compose up -d --scale catalog-service=3
    build: ./catalog-service
    networks: [appnet]
    depends_on:
      consul: {condition: service_healthy}

  collection-service:       # own SQLite DB (outbox + saga_log) on a volume
    build: ./collection-service
    networks: [appnet]
    volumes: [collection-data:/data]
    environment:
      SAGA_TIMEOUT_SECONDS: "20"
    depends_on: *infra

  rating-service:
    build: ./rating-service
    networks: [appnet]
    depends_on: *infra

  analytics-consumer:       # own SQLite DB (inbox); every 3rd album_completed fails on purpose
    build: ./analytics-consumer
    networks: [appnet]
    volumes: [analytics-data:/data]
    environment:
      FAIL_EVERY_N: "3"
    depends_on: *infra

  api-gateway:
    build: ./api-gateway
    ports: ["8080:8080"]
    networks: [appnet]
    depends_on:
      consul: {condition: service_healthy}

volumes:
  collection-data:
  analytics-data:

networks:
  appnet:
    driver: bridge
